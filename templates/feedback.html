<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>RaktDhara — Feedback</title>

  <!-- Google font -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;700;900&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
:root {
  --bg:#07121a;
  --card:#071821;
  --muted:#9aa6ab;
  --teal:#00b3b3;
  --blood:#c80f2e;
}

body {
  margin:0;
  font-family:'Montserrat',sans-serif;
  background: linear-gradient(180deg,#07121a 0%, #041119 100%);
  color:#e9f7f7;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}
.content { flex:1; }
html { scroll-behavior: smooth; }

.topbar {
  background: rgba(2,10,12,.55);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid rgba(255,255,255,0.04);
  padding:12px 0;
  position:sticky;
  top:0;
  z-index:40;
}
.brand-row { display:flex; align-items:center; gap:12px; }
.brand-logo { width:80px; height:80px; border-radius:50%; object-fit:cover; }
.brand-title { font-weight:800; font-size:1.15rem; color:#ffffff }
.brand-title .rakt {color:#fff;}
.brand-title .dhara {color:var(--blood)}

.page-hero {
  padding:60px 0;
  text-align:center;
}
.page-hero h1 {
  font-weight:900;
  font-size:2.5rem;
  margin-bottom:10px;
}
.page-hero p { color:var(--muted); font-size:1.1rem; }

.card-panel {
  background: linear-gradient(180deg, rgba(6,18,23,.9), rgba(8,20,25,.85));
  border-radius:16px;
  padding:26px;
  border:1px solid rgba(255,255,255,0.04);
  box-shadow: 0 18px 50px rgba(0,0,0,.6);
}
.form-title { color:var(--blood); font-weight:800; margin-bottom:8px; }
.form-sub { color:var(--muted); margin-bottom:18px; }
.form-control {
  background: rgba(255,255,255,0.03);
  color:#eaf6f6;
  border:1px solid rgba(255,255,255,0.06);
  border-radius:10px;
  padding:.65rem .9rem;
}
.form-control::placeholder { color:#9fb1b7 }
.submit-btn {
  background: linear-gradient(90deg,var(--blood), #ff6b88);
  border:none;
  color:#fff;
  font-weight:800;
  padding:.85rem;
  border-radius:12px;
  box-shadow:0 10px 28px rgba(200,15,46,.25);
}
footer {
  background:#041119;
  padding:30px 0;
  border-top:1px solid rgba(255,255,255,0.08);
  text-align:center;
  color:var(--muted);
  font-size:0.9rem;
}
  </style>
</head>
<body>

  <!-- Topbar -->
  <header class="topbar">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="brand-row">
        <img src="{{ url_for('static', filename='images/logo.jpeg') }}" alt="Logo" class="brand-logo">
        <div>
          <div class="brand-title"><span class="rakt">Rakt</span><span class="dhara">Dhara</span></div>
          <div style="font-size:.85rem; color:var(--muted)">Donate • Save • Smile</div>
        </div>
      </div>
      <div class="d-none d-md-flex align-items-center">
        <a class="btn btn-danger btn-sm ms-2" href="/">Home</a>
        <a class="btn btn-danger btn-sm ms-2" href="/login">User</a>
        <a class="btn btn-warning btn-sm ms-2" href="/admin">Admin</a>
        <a class="btn btn-success btn-sm ms-2" href="/donor_status">Donor Status</a>
        <a class="btn btn-success btn-sm ms-2" href="/feedback">Feedback</a>
        <a class="btn btn-danger btn-sm ms-2" href="/#team">Our Team</a>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="page-hero">
    <div class="container">
      <h1>We Value Your Feedback</h1>
      <p>Your suggestions help us improve and save more lives ❤️</p>
    </div>
  </section>

  <!-- Feedback Form -->
  <main class="content">
    <div class="container" style="max-width:700px;">
      <div class="card-panel">
        <div class="form-title">Share Your Thoughts</div>
        <div class="form-sub">Fill out the form below</div>
        <form method="POST" action="/submit_feedback">
          <div class="mb-3">
            <input type="text" class="form-control" name="name" placeholder="Your Name" required>
          </div>
          <div class="mb-3">
            <input type="email" class="form-control" name="email" placeholder="Your Email" required>
          </div>
          <div class="mb-3">
            <textarea class="form-control" name="message" rows="5" placeholder="Your Feedback" required></textarea>
          </div>
          <div class="d-grid">
            <button type="submit" class="submit-btn">Submit Feedback</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      &copy; {{ current_year }} RaktDhara — All Rights Reserved
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
