<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon"
      href="{{ url_for('static', filename='logo_circular.ico') }}">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>User Login — RaktDhara</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>

    /* =========================================================
       ROOT
    ========================================================= */

    :root {
      --blood: #d90429;
      --blood-dark: #8b001b;
      --blood-light: #ff4d6d;
      --cyan: #00d9ff;

      --bg: #05080c;
      --card: rgba(13, 18, 25, 0.88);
      --card-soft: rgba(255,255,255,0.035);

      --border: rgba(255,255,255,0.09);
      --text: #f4f7fa;
      --muted: #9aa6b2;
    }


    /* =========================================================
       GLOBAL
    ========================================================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: 'Montserrat', sans-serif;
      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(217,4,41,0.14),
          transparent 32%
        ),
        radial-gradient(
          circle at 80% 80%,
          rgba(0,217,255,0.08),
          transparent 30%
        ),
        var(--bg);

      color: var(--text);
      overflow: hidden;
      position: relative;
    }


    /* =========================================================
       TECH GRID BACKGROUND
    ========================================================= */

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;

      background-image:
        linear-gradient(
          rgba(255,255,255,0.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,0.025) 1px,
          transparent 1px
        );

      background-size: 45px 45px;

      mask-image: linear-gradient(
        to bottom,
        rgba(0,0,0,1),
        rgba(0,0,0,0.15)
      );

      z-index: 0;
    }


    /* =========================================================
       AMBIENT GLOW
    ========================================================= */

    .glow {
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.16;
      pointer-events: none;
      z-index: 0;
    }

    .glow-red {
      background: var(--blood);
      top: -180px;
      left: -150px;
    }

    .glow-blue {
      background: var(--cyan);
      bottom: -220px;
      right: -150px;
    }


    /* =========================================================
       NAVBAR / HOME BUTTON
    ========================================================= */

    .top-bar {
      position: fixed;
      top: 22px;
      left: 28px;
      right: 28px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      color: #fff;
      text-decoration: none;

      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;

      background: var(--blood-light);

      box-shadow:
        0 0 8px var(--blood),
        0 0 18px rgba(217,4,41,0.7);

      animation: pulseDot 1.8s infinite;
    }

    @keyframes pulseDot {

      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.55;
        transform: scale(0.75);
      }
    }

    .btn-home {
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.045);

      backdrop-filter: blur(12px);

      border-radius: 10px;
      padding: 9px 17px;

      color: #fff;

      transition: 0.25s ease;
    }

    .btn-home:hover {
      color: #fff;
      border-color: var(--cyan);

      box-shadow:
        0 0 15px rgba(0,217,255,0.18);

      transform: translateY(-2px);
    }


    /* =========================================================
       MAIN CONTAINER
    ========================================================= */

    .page-wrapper {
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 80px 20px 30px;

      position: relative;
      z-index: 5;
    }


    /* =========================================================
       LOGIN CARD
    ========================================================= */

    .login-card {
      width: min(440px, 100%);

      position: relative;

      padding: 38px 38px 32px;

      background: var(--card);

      border: 1px solid var(--border);

      border-radius: 24px;

      backdrop-filter: blur(22px);

      box-shadow:
        0 25px 80px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.05);

      animation: cardEntry 0.75s ease both;
    }

    @keyframes cardEntry {

      from {
        opacity: 0;
        transform: translateY(30px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }


    /* =========================================================
       TOP CARD LINE
    ========================================================= */

    .card-line {
      position: absolute;

      top: 0;
      left: 12%;
      right: 12%;

      height: 2px;

      background: linear-gradient(
        90deg,
        transparent,
        var(--blood),
        var(--blood-light),
        transparent
      );

      box-shadow:
        0 0 15px rgba(217,4,41,0.65);
    }


    /* =========================================================
       LOGO
    ========================================================= */

    .logo-wrapper {
      width: 125px;
      height: 125px;

      margin: 0 auto 22px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle,
          rgba(217,4,41,0.16),
          rgba(5,8,12,0.7)
        );

      border: 1px solid rgba(255,255,255,0.08);

      box-shadow:
        0 0 25px rgba(217,4,41,0.18),
        inset 0 0 25px rgba(217,4,41,0.08);

      animation: logoFloat 4s ease-in-out infinite;
    }

    .logo-big {
      width: 105px;
      height: 105px;

      object-fit: cover;

      border-radius: 50%;

      box-shadow:
        0 0 20px rgba(217,4,41,0.45);
    }

    @keyframes logoFloat {

      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }


    /* =========================================================
       HEADING
    ========================================================= */

    .login-card h1 {
      margin: 0;

      font-size: 1.75rem;
      font-weight: 800;

      text-align: center;

      background: linear-gradient(
        135deg,
        #ffffff,
        #ffccd5,
        var(--blood-light)
      );

      -webkit-background-clip: text;
      background-clip: text;

      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      text-align: center;

      color: var(--muted);

      font-size: 0.82rem;

      margin-top: 8px;
      margin-bottom: 27px;
    }


    /* =========================================================
       SECURITY BADGE
    ========================================================= */

    .security-badge {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 8px;

      margin-bottom: 22px;

      font-size: 0.7rem;

      color: #9feaff;

      letter-spacing: 0.6px;
    }

    .security-badge i {
      color: var(--cyan);

      text-shadow:
        0 0 10px rgba(0,217,255,0.7);
    }


    /* =========================================================
       ALERT
    ========================================================= */

    .login-alert {
      border-radius: 12px;

      background: rgba(220,53,69,0.12);

      border: 1px solid rgba(220,53,69,0.3);

      color: #ffb8c1;

      font-size: 0.8rem;

      margin-bottom: 20px;
    }


    /* =========================================================
       FORM
    ========================================================= */

    .field-label {
      display: block;

      color: #c8d0d8;

      font-size: 0.72rem;
      font-weight: 600;

      margin-bottom: 7px;
    }

    .input-group-custom {
      position: relative;
    }

    .input-icon {
      position: absolute;

      left: 14px;
      top: 50%;

      transform: translateY(-50%);

      color: #788592;

      font-size: 0.9rem;

      z-index: 5;
    }

    .form-control {
      height: 48px;

      background: rgba(255,255,255,0.045);

      border: 1px solid rgba(255,255,255,0.10);

      color: #fff;

      border-radius: 11px;

      padding-left: 43px;

      font-size: 0.85rem;

      transition: 0.25s ease;
    }

    .form-control::placeholder {
      color: #6f7b86;
    }

    .form-control:hover {
      border-color: rgba(255,255,255,0.18);
    }

    .form-control:focus {
      background: rgba(255,255,255,0.06);

      border-color: var(--blood-light);

      color: #fff;

      box-shadow:
        0 0 0 3px rgba(217,4,41,0.12),
        0 0 20px rgba(217,4,41,0.08);
    }


    /* =========================================================
       PASSWORD TOGGLE
    ========================================================= */

    .password-toggle {
      position: absolute;

      right: 14px;
      top: 50%;

      transform: translateY(-50%);

      border: none;
      background: transparent;

      color: #7d8994;

      cursor: pointer;

      z-index: 5;

      transition: 0.2s;
    }

    .password-toggle:hover {
      color: var(--blood-light);
    }

    #password {
      padding-right: 45px;
    }


    /* =========================================================
       LOGIN BUTTON
    ========================================================= */

    .btn-login {
      position: relative;

      width: 100%;

      height: 49px;

      margin-top: 8px;

      border: none;

      border-radius: 11px;

      color: #fff;

      font-weight: 700;

      font-size: 0.88rem;

      background: linear-gradient(
        100deg,
        #8f001d,
        #d90429,
        #ff4d6d
      );

      box-shadow:
        0 8px 25px rgba(217,4,41,0.22);

      overflow: hidden;

      transition: 0.25s ease;
    }

    .btn-login::before {
      content: "";

      position: absolute;

      top: 0;
      left: -120%;

      width: 70%;
      height: 100%;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.22),
        transparent
      );

      transform: skewX(-20deg);

      transition: 0.6s;
    }

    .btn-login:hover::before {
      left: 150%;
    }

    .btn-login:hover {
      transform: translateY(-2px);

      box-shadow:
        0 12px 30px rgba(217,4,41,0.35);
    }

    .btn-login:active {
      transform: translateY(0);
    }


    /* =========================================================
       SECONDARY BUTTON
    ========================================================= */

    .btn-change {
      width: 100%;

      height: 45px;

      border-radius: 11px;

      border: 1px solid rgba(255,255,255,0.11);

      background: rgba(255,255,255,0.035);

      color: #cbd4dc;

      font-size: 0.8rem;
      font-weight: 600;

      transition: 0.25s ease;
    }

    .btn-change:hover {
      color: #fff;

      border-color: rgba(217,4,41,0.55);

      background: rgba(217,4,41,0.08);

      transform: translateY(-1px);
    }


    /* =========================================================
       FORGOT PASSWORD
    ========================================================= */

    .forgot-link {
      display: block;

      text-align: center;

      margin-top: 18px;

      color: #9defff;

      text-decoration: none;

      font-size: 0.76rem;
      font-weight: 500;

      transition: 0.2s;
    }

    .forgot-link:hover {
      color: var(--cyan);

      text-decoration: underline;
    }


    /* =========================================================
       FOOTER SECURITY TEXT
    ========================================================= */

    .authorized {
      text-align: center;

      margin-top: 25px;

      color: #68737d;

      font-size: 0.68rem;

      letter-spacing: 0.5px;
    }

    .authorized i {
      color: #46d17a;

      margin-right: 5px;
    }


    /* =========================================================
       BLOOD DROPS
    ========================================================= */

    .blood-drop {
      position: fixed;

      top: -25px;

      width: 5px;
      height: 12px;

      background: linear-gradient(
        to bottom,
        var(--blood-light),
        var(--blood-dark)
      );

      border-radius: 70% 70% 55% 55%;

      opacity: 0.45;

      pointer-events: none;

      z-index: 1;

      filter:
        drop-shadow(
          0 0 5px rgba(217,4,41,0.7)
        );

      animation-name: fall;

      animation-timing-function: linear;

      animation-fill-mode: forwards;
    }

    @keyframes fall {

      0% {
        transform: translateY(-30px);
        opacity: 0;
      }

      10% {
        opacity: 0.5;
      }

      90% {
        opacity: 0.25;
      }

      100% {
        transform: translateY(110vh);
        opacity: 0;
      }
    }


    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (max-width: 576px) {

      body {
        overflow-y: auto;
      }

      .top-bar {
        top: 15px;
        left: 16px;
        right: 16px;
      }

      .brand {
        font-size: 0.7rem;
      }

      .page-wrapper {
        padding: 80px 15px 25px;
      }

      .login-card {
        padding: 32px 22px 27px;

        border-radius: 20px;
      }

      .logo-wrapper {
        width: 105px;
        height: 105px;
      }

      .logo-big {
        width: 88px;
        height: 88px;
      }

      .login-card h1 {
        font-size: 1.5rem;
      }
    }

  </style>
</head>

<body>

  <!-- Ambient Background -->
  <div class="glow glow-red"></div>
  <div class="glow glow-blue"></div>


  <!-- Top Navigation -->
  <div class="top-bar">

    <a href="{{ url_for('home') }}" class="brand">
      <span class="brand-dot"></span>
      RAKTDHARA
    </a>

    <a href="{{ url_for('home') }}"
       class="btn btn-home">
      <i class="fa-solid fa-house me-1"></i>
      Home
    </a>

  </div>


  <!-- Login Section -->
  <main class="page-wrapper">

    <div class="login-card">

      <div class="card-line"></div>


      <!-- Logo -->
      <div class="logo-wrapper">

        <img
          src="{{ url_for('static', filename='images/logo.jpeg') }}"
          alt="RaktDhara Logo"
          class="logo-big"
        >

      </div>


      <!-- Heading -->
      <h1>User Login</h1>

      <p class="subtitle">
        Access your RaktDhara account securely
      </p>


      <!-- Security Indicator -->
      <div class="security-badge">

        <i class="fa-solid fa-shield-halved"></i>

        <span>
          SECURE AUTHENTICATED ACCESS
        </span>

      </div>


      <!-- Error -->
      {% if error %}

        <div class="alert login-alert">
          <i class="fa-solid fa-circle-exclamation me-2"></i>
          {{ error }}
        </div>

      {% endif %}


      <!-- Login Form -->
      <form method="POST">

        <!-- Email -->
        <div class="mb-3">

          <label class="field-label">
            Email Address
          </label>

          <div class="input-group-custom">

            <i class="fa-solid fa-envelope input-icon"></i>

            <input
              type="email"
              name="email"
              class="form-control"
              placeholder="Enter your email"
              autocomplete="email"
              required
            >

          </div>

        </div>


        <!-- Password -->
        <div class="mb-3">

          <label class="field-label">
            Password
          </label>

          <div class="input-group-custom">

            <i class="fa-solid fa-lock input-icon"></i>

            <input
              type="password"
              name="password"
              id="password"
              class="form-control"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="password-toggle"
              id="togglePassword"
              aria-label="Show password"
            >
              <i class="fa-solid fa-eye"></i>
            </button>

          </div>

        </div>


        <!-- Login -->
        <button
          type="submit"
          class="btn btn-login"
        >
          <i class="fa-solid fa-right-to-bracket me-2"></i>
          Login
        </button>

      </form>


      <!-- Change Password -->
      <div class="mt-3">

        <a
          href="{{ url_for('change_password') }}"
          class="btn btn-change"
        >
          <i class="fa-solid fa-key me-2"></i>
          Change Password
        </a>

      </div>


      <!-- Forgot Password -->
      <a
        href="{{ url_for('reset_password') }}"
        class="forgot-link"
      >
        <i class="fa-solid fa-rotate-left me-1"></i>
        Forgot Password?
      </a>


      <!-- Security Footer -->
      <div class="authorized">

        <i class="fa-solid fa-circle-check"></i>

        Authorized access only • RaktDhara Blood Network

      </div>

    </div>

  </main>


  <!-- =======================================================
       PASSWORD SHOW / HIDE
  ======================================================== -->

  <script>

    const passwordInput =
      document.getElementById("password");

    const togglePassword =
      document.getElementById("togglePassword");

    togglePassword.addEventListener("click", function () {

      const icon =
        this.querySelector("i");

      if (passwordInput.type === "password") {

        passwordInput.type = "text";

        icon.classList.remove("fa-eye");

        icon.classList.add("fa-eye-slash");

        this.setAttribute(
          "aria-label",
          "Hide password"
        );

      } else {

        passwordInput.type = "password";

        icon.classList.remove("fa-eye-slash");

        icon.classList.add("fa-eye");

        this.setAttribute(
          "aria-label",
          "Show password"
        );

      }

    });


    /* =======================================================
       ANIMATED BLOOD DROPS
    ======================================================== */

    function createDrop() {

      const drop =
        document.createElement("div");

      drop.classList.add("blood-drop");

      drop.style.left =
        Math.random() * window.innerWidth + "px";

      drop.style.animationDuration =
        (3 + Math.random() * 4) + "s";

      drop.style.opacity =
        (0.2 + Math.random() * 0.35);

      const size =
        3 + Math.random() * 4;

      drop.style.width =
        size + "px";

      drop.style.height =
        (size * 2.2) + "px";

      document.body.appendChild(drop);

      setTimeout(() => {

        drop.remove();

      }, 7500);

    }

    setInterval(createDrop, 450);

  </script>

</body>
</html>
