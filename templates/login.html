<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>User Login — Raktadhara</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      height: 100vh;
      background: #0b0f13; /* Dark background */
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #e0e0e0;
    }
    @keyframes fall {
      0% { transform: translateY(-20px); opacity: 1; }
      100% { transform: translateY(110vh); opacity: 0; }
    }

    /* Login card */
    .login-card {
      position: relative;
      z-index: 10;
      background: #141a20; /* Dark card */
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      text-align: center;
      width: 380px;
    }
    .login-card h2 { 
      color: #0dcaf0; 
      margin: 20px 0; 
      font-weight: 700;
    }

    .btn-home {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 20;
    }

    .logo-big {
      height: 140px;
      margin-bottom: 20px;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(13,202,240,0.4);
    }

    /* Form fields */
    .form-control {
      background: #1e252c;
      border: 1px solid #2d3a44;
      color: #e0e0e0;
      border-radius: 10px;
    }
    .form-control:focus {
      background: #252c34;
      border-color: #0dcaf0;
      color: #fff;
      box-shadow: 0 0 0 0.25rem rgba(13,202,240,0.25);
    }

    /* Buttons */
    .btn-login {
      background: linear-gradient(90deg,#c80f2e,#ff6b88);
      border: none;
      font-weight: 700;
      border-radius: 10px;
      padding: 12px;
    }
    .btn-login:hover {
      box-shadow: 0 6px 18px rgba(200,15,46,0.4);
      transform: translateY(-2px);
    }

    .btn-outline-danger {
      border-radius: 10px;
    }

    /* Links */
    .link-btn {
      display: block;
      margin-top: 10px;
      font-size: 0.9rem;
      color: #0dcaf0;
      text-decoration: none;
    }
    .link-btn:hover { 
      text-decoration: underline; 
      color: #08a5c4;
    }

    .text-muted {
      color: #aaa !important;
    }
  </style>
</head>
<body>
  <!-- Home Button -->
  <a href="{{ url_for('home') }}" class="btn btn-outline-light btn-home">Home</a>

  <!-- Falling Blood Drops -->
  <script>
    function createDrop() {
      const drop = document.createElement("div");
      drop.classList.add("blood-drop");
      drop.style.left = Math.random() * window.innerWidth + "px";
      drop.style.animationDuration = 2 + Math.random() * 3 + "s";
      document.body.appendChild(drop);
      setTimeout(() => drop.remove(), 5000);
    }
    setInterval(createDrop, 300);
  </script>

  <!-- Login Card -->
  <div class="login-card">
    <img src="{{ url_for('static', filename='images/logo.jpeg') }}" alt="Raktadhara Logo" class="logo-big">
    <h2>User Login</h2>

    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="mb-3">
        <input type="email" name="email" class="form-control" placeholder="Email" required>
      </div>
      <div class="mb-3">
        <input type="password" name="password" class="form-control" placeholder="Password" required>
      </div>
      <button type="submit" class="btn btn-login w-100">Login</button>
    </form>

    <!-- Change Password Button -->
    <div class="mt-3">
      <a href="{{ url_for('change_password') }}" class="btn btn-outline-danger w-100">
        🔄 Change Password
      </a>
    </div>

    <!-- Forgot Password Link -->
    <a href="{{ url_for('reset_password') }}" class="link-btn">❓ Forgot Password?</a>

    <p class="mt-3 text-muted small">Authorized access only</p>
  </div>
</body>
</html>
