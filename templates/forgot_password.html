<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Reset Password — Rakt Dhara</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f8f9fa;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .card {
      width: 400px;
      padding: 30px;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      position: relative;
      z-index: 10;
    }
    .card h3 {
      color: #0dcaf0;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .btn-teal {
      background: #0dcaf0;
      border: none;
      font-weight: 600;
      color: #fff;
      border-radius: 12px;
    }
    .btn-teal:hover { background: #0bb1d6; }
    .logo {
      display: block;
      margin: 0 auto 15px;
      height: 90px;
    }
    .alert {
      font-size: 0.95rem;
      padding: 10px 14px;
      border-radius: 10px;
      text-align: left;
    }
    .back-link {
      display: inline-block;
      margin-top: 15px;
      font-size: 0.9rem;
      text-decoration: none;
      color: #0dcaf0;
      font-weight: 600;
    }
    .back-link:hover {
      color: #0bb1d6;
      text-decoration: underline;
    }
    /* Falling Ambulance */
    .ambulance {
      position: absolute;
      top: -160px;
      width: 150px;
      height: auto;
      animation: fall linear forwards;
    }
    @keyframes fall {
      0% { transform: translateY(-70px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <!-- Reset Password Card -->
  <div class="card">
    <img src="{{ url_for('static', filename='images/logo.jpeg') }}" alt="Rakt Dhara Logo" class="logo">
    <h3>Reset Password</h3>

    <!-- Flask flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} mt-2">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% if success %}
      <a href="{{ url_for('login') }}" class="btn btn-teal w-100 mt-3">⬅ Back to Login</a>
    {% else %}
      <form method="POST">
        <div class="mb-3 text-start">
          <label class="form-label">Enter your registered email</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-teal w-100">Send Reset OTP</button>
      </form>
      <a href="{{ url_for('login') }}" class="back-link">⬅ Back to Login</a>
    {% endif %}
  </div>

  <!-- Falling Ambulances Script -->
  <script>
    function createAmbulance() {
      const ambulance = document.createElement("img");
      ambulance.src = "{{ url_for('static', filename='images/ambulance.png') }}"; 
      ambulance.classList.add("ambulance");
      ambulance.style.left = Math.random() * window.innerWidth + "px";
      ambulance.style.animationDuration = 3 + Math.random() * 3 + "s";
      document.body.appendChild(ambulance);
      setTimeout(() => ambulance.remove(), 6000);
    }
    setInterval(createAmbulance, 2500);
  </script>
</body>
</html>
