<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon"
      href="{{ url_for('static', filename='logo_circular.ico') }}">
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Registration Successful — RaktDhara</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', sans-serif; background: #f8f9fa; }
    .success-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      padding: 40px;
      max-width: 600px;
      margin: 80px auto;
      text-align: center;
    }
    .success-icon { font-size: 60px; color: #0dcaf0; }
    .credentials {
      margin-top: 20px;
      text-align: left;
    }
    .credentials p {
      font-size: 1.1rem;
      padding: 10px;
      background: #f1f1f1;
      border-radius: 10px;
    }
    .btn-custom {
      background: #0dcaf0; border: none;
      color: white; padding: 12px 24px;
      font-weight: 600; border-radius: 12px;
      margin-top: 20px;
    }
    .btn-custom:hover { background: #0bb1d6; }
  </style>
</head>
<body>
  <div class="success-card">
    <div class="success-icon">✅</div>
    <h2 class="mt-3">Welcome, {{ full_name }}!</h2>
    <p class="text-muted">Your registration has been successfully completed.</p>
    <div class="credentials">
      <h5 class="mb-3">Your Login Credentials:</h5>
      <p><strong>Email:</strong> {{ email }}</p>
      <p><strong>Password:</strong> {{ password }}</p>
    </div>
    <p class="mt-3 text-danger"><strong>⚠️ Important:</strong> Please log in and change your password immediately.</p>
    <a href="{{ url_for('login') }}" class="btn btn-custom">Go to Login</a>
  </div>
</body>
</html>
