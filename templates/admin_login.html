<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Admin Login — Rakt Dhara</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      background: #0b0f13; /* Dark background */
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #e0e0e0;
    }

    .blood-drop {
      position: absolute;
      top: -20px;
      width: 12px;
      height: 20px;
      background: crimson;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      opacity: 0.8;
      animation: fall linear infinite;
      z-index: 1;
    }

    @keyframes fall {
      0% { transform: translateY(-20px); opacity: 1; }
      100% { transform: translateY(110vh); opacity: 0; }
    }

    .login-card {
      position: relative;
      z-index: 10;
      background: #141a20; /* Dark card */
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(0,0,0,0.6);
      text-align: center;
      color: #e0e0e0;
      width: 380px;
    }

    .login-card h2 {
      color: #0dcaf0;
      margin: 20px 0;
      font-weight: 700;
    }

    .btn-home {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 20;
      color: #0dcaf0;
      border-color: #0dcaf0;
    }

    .btn-home:hover {
      background: #0dcaf0;
      color: #fff;
    }

    .logo-big {
      height: 160px;
      margin-bottom: 20px;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(13,202,240,0.3);
    }

    .form-control {
      background: #1e252c;
      border: 1px solid #2d3a44;
      color: #fff;
      border-radius: 10px;
    }

    .form-control::placeholder {
      color: #888;
    }

    .form-control:focus {
      background: #252c34;
      border-color: #0dcaf0;
      color: #fff;
      box-shadow: 0 0 0 0.25rem rgba(13,202,240,0.25);
    }

    .btn-login {
      background: linear-gradient(90deg,#0dcaf0,#08a5c4);
      border: none;
      font-weight: 600;
      color: #fff;
      border-radius: 12px;
      padding: 12px;
      transition: all 0.3s ease-in-out;
    }

    .btn-login:hover {
      background: linear-gradient(90deg,#08a5c4,#0dcaf0);
      box-shadow: 0 6px 18px rgba(13,202,240,0.35);
      transform: translateY(-2px);
    }

    .alert {
      font-size: 0.95rem;
      padding: 10px 14px;
      border-radius: 10px;
      text-align: center;
    }

    .text-muted {
      color: #aaa !important;
    }
  </style>
</head>
<body>
  <!-- Home Button -->
  <a href="{{ url_for('home') }}" class="btn btn-outline-info btn-home">Home</a>

  <!-- Falling Blood Drops -->
  <script>
    function createDrop() {
      const drop = document.createElement("div");
      drop.classList.add("blood-drop");
      drop.style.left = Math.random() * window.innerWidth + "px";
      drop.style.animationDuration = 2 + Math.random() * 3 + "s";
      document.body.appendChild(drop);
      setTimeout(() => drop.remove(), 5000);
    }
    setInterval(createDrop, 300);
  </script>

  <!-- Login Card -->
  <div class="login-card">
    <img src="{{ url_for('static', filename='images/logo.jpeg') }}" alt="Rakt Dhara Logo" class="logo-big">
    <h2>Admin Login</h2>
    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <div class="mb-3">
        <input type="email" name="email" class="form-control" placeholder="Email" required>
      </div>
      <div class="mb-3">
        <input type="password" name="password" class="form-control" placeholder="Password" required>
      </div>
      <button type="submit" class="btn btn-login w-100">Login</button>
    </form>
    <p class="mt-3 text-muted small">Authorized access only</p>
  </div>
</body>
</html>
