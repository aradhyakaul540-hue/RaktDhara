<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verification Failed</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fce4e4;
            color: #b71c1c;
            text-align: center;
            padding: 50px;
        }
        .box {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
        }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #b71c1c;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        a:hover {
            background: #d32f2f;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>OTP Verification Failed ❌</h1>
        <p>Sorry, the OTP you entered for <b>{{ email }}</b> is invalid.</p>
        <a href="/">Go back to Registration</a>
    </div>
</body>
</html>
